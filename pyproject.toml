[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "invertmeeg"
version = "1.2.0"
description = "A high-level Python library for M/EEG inverse solutions"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Lukas Hecker", email = "lukas.hecker.job@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "mne>=1.11",
    "scikit-learn>=1.8",
    "matplotlib>=3.10",
    "tqdm",
    "pandas>=3",
    "POT>=0.9.6.post1",
    "nibabel>=5.3.3",
    "pydantic>=2.12.5",
    "seaborn>=0.13.2",
]

[project.scripts]
invertmeeg = "invert.__main__:main"

[project.optional-dependencies]
ann = [
    "torch>=2.10",
]
viz = [
    "pyvista",
    "pyvistaqt",
    "PyQt5",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]
notebooks = [
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/LukeTheHecker/invertmeeg"
Documentation = "https://lukethehecker.github.io/invertmeeg/"
License = "https://www.gnu.org/licenses/gpl-3.0.en.html"

[tool.hatch.build.targets.wheel]
packages = ["invert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: evaluation/property tests that take longer to run (use -m slow to select)",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "N803",  # Allow uppercase in argument names (common in math)
    "N806",  # Allow uppercase in variable names (common in math)
    "N802",  # Allow uppercase in function names (common in math)
    "N801",  # Allow non-CapWords class names
    "N812",  # Allow lowercase imported as non-lowercase
    "N999",  # Allow invalid module name
    "E741",  # Allow ambiguous variable names (l, I, O - common in math)
    "C901",  # Allow complex functions (scientific algorithms are inherently complex)
    "E501",  # Allow long lines (handled by formatter for code, comments can be long)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"invert/solvers/neural_networks/*.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["_old/", "scripts/old/"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-timeout>=2.4",
    "ruff",
    "mypy",
    "pre-commit",
    "pip-audit",
    "twine",
]
